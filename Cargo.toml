[workspace]
members = ["jet-plugin-sdk"]

[package]
name = "jet"
version = "1.0.0"
edition = "2021"
authors = ["Jet Editor Team"]
description = "A small, fast terminal text editor with lazy mmap loading and SIMD search."
license = "MIT"
repository = "https://github.com/jet-editor/jet"
readme = "README.md"

[dependencies]
clap           = { version = "4", features = ["derive"] }
anyhow         = "1"
thiserror      = "1"
ratatui        = "0.27"
crossterm      = "0.27"
ropey          = "1.6"
memmap2        = "0.9"
diamond-types  = "1.0"
tree-sitter           = "0.22"
tree-sitter-highlight = "0.22"
tree-sitter-rust        = "0.21.2"
tree-sitter-python      = "0.21"
tree-sitter-json        = "0.21"
tree-sitter-bash        = "0.21"
tree-sitter-javascript  = "0.23"
tree-sitter-typescript  = "0.23"
tree-sitter-go          = "0.21"

tungstenite             = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
memchr         = "2.7"
aho-corasick   = "1.1"
regex-automata = "0.4"
rayon          = "1.12"
tokio          = { version = "1", features = ["full"] }
lsp-types      = "0.95"
serde_json     = "1"
nucleo         = "0.5"
nucleo-matcher = "0.3"
portable-pty   = "0.8"
serde          = { version = "1", features = ["derive"] }
toml           = "0.8"
unicode-segmentation = "1"
unicode-width        = "0.1"
git2           = { version = "0.18", features = ["vendored-libgit2", "vendored-openssl"] }
notify         = "6"
bincode        = "1"
uuid           = { version = "1", features = ["v4"] }
tempfile       = "3"
wasmtime       = { version = "44.0.1", default-features = false, features = ["anyhow", "cranelift", "runtime", "std"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
wat = "1.246.1"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
procfs = "0.17"

[[bench]]
name = "core"
harness = false

[[bench]]
name = "open_large_file"
harness = false

[[bench]]
name = "search_simd"
harness = false

[[bench]]
name = "render_frame"
harness = false

[[bench]]
name = "treesitter"
harness = false

[[bench]]
name = "startup"
harness = false

[[bench]]
name = "cold_start"
harness = false

[[bench]]
name = "rss_bench"
harness = false

[[bin]]
name = "fake-lsp"
path = "src/bin/fake-lsp.rs"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = "symbols"
panic         = "abort"
